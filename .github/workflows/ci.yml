name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: observatorio_teste
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/observatorio_teste
      DATABASE_URL_MIGRACAO: postgres://postgres:postgres@localhost:5432/observatorio_teste

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Aplicar migrações
        run: pnpm migrar

      - name: Popular dados de referência
        run: pnpm seed

      - name: Tipos
        run: pnpm tipos

      - name: Lint e formatação
        run: pnpm lint

      - name: Testes de unidade
        run: pnpm teste

      # Gate de integridade: anexo obrigatório sem espelho local quebra o
      # build. Traduz em pipeline o risco de maior impacto do projeto.
      #
      # Roda ANTES do build de propósito: é o build que produz o artefato
      # publicável — inclusive o pacote .zip enviado ao R2 pelo
      # scripts/gerar-zip-anexos.ts. Denunciar depois disso seria denunciar
      # tarde.
      #
      # O ramo do áudio público sem consentimento válido ainda não está na
      # view: depende da tabela `entrevista`, que é de Fase 3. Ver
      # docs/tarefas/09-gate-de-pendencias.md.
      - name: Pendências de publicação
        run: pnpm pendencias

      - name: Build
        run: pnpm build

      - name: Instalar navegadores
        run: pnpm exec playwright install --with-deps chromium

      - name: Acessibilidade (axe-core)
        run: pnpm a11y

      # Lighthouse CI — passo REMOVIDO em 2026-09-01 porque falhava sempre:
      # "Command 'lhci' not found". O `lighthouserc.json` existe na raiz e está
      # versionado desde o commit e509462, com as quatro asserções de ≥ 0.9;
      # o que nunca foi instalado é o pacote `@lhci/cli`, ausente do
      # package.json e do pnpm-lock.yaml.
      #
      # Isto NÃO é limpeza de passo órfão: o gate continua exigido pelo
      # doc 03 §7 e §14 e pelo doc 01, e a Tarefa 10 manda rodar
      # `pnpm exec lhci autorun` para verificar a home. Ele está adiado, não
      # cancelado.
      #
      # A implementação pertence ao item 26 do backlog (doc 03 §10, Fase 4):
      # "Auditoria WCAG final, Lighthouse CI, depósito no Zenodo, arquivamento
      # no Internet Archive". Registro formal da divergência, com o que falta
      # além da dependência: docs/divida-documental.md §4.
      #
      # Atenção a quem for restaurar: instalar `@lhci/cli` não basta. O
      # `lighthouserc.json` não tem `startServerCommand` e este workflow não
      # sobe servidor — o passo trocaria "command not found" por "connection
      # refused". Falta também o `throttling` de 3G que o doc 01 §7 exige.

      - name: Anexar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            playwright-report/
          retention-days: 7
