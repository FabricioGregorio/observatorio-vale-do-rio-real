name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Sem serviço de banco e sem credencial: em 24/09/2026 o PostgreSQL saiu
    # do projeto, e o pipeline não tem mais o que provisionar. Os dados
    # públicos são versionados em src/dados/publicado/ e o build não abre
    # conexão nenhuma.

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tipos
        run: pnpm tipos

      - name: Lint e formatação
        run: pnpm lint

      - name: Testes de unidade
        run: pnpm teste

      # O gate de pendências de publicação rodava aqui, contra uma view do
      # banco: anexo obrigatório sem espelho local quebrava o pipeline. A view
      # saiu com o banco, e o que ela conferia passou a ser propriedade do
      # snapshot versionado — `validarAcervoPublico` exige os dezesseis
      # documentos e a reconciliação de B01 em toda leitura, inclusive nos
      # testes acima e no build abaixo.
      #
      # `pnpm build` não escreve no R2 e não publica pacote nenhum.
      - name: Build
        run: pnpm build

      - name: Instalar navegadores
        run: pnpm exec playwright install --with-deps chromium

      - name: Acessibilidade (axe-core)
        run: pnpm a11y

      # Lighthouse CI — passo REMOVIDO em 2026-09-01 porque falhava sempre:
      # "Command 'lhci' not found". O `lighthouserc.json` existe na raiz e está
      # versionado desde o commit e509462, com as quatro asserções de ≥ 0.9;
      # o que nunca foi instalado é o pacote `@lhci/cli`, ausente do
      # package.json e do pnpm-lock.yaml.
      #
      # Isto NÃO é limpeza de passo órfão: o gate do Lighthouse continua
      # exigido, e `pnpm exec lhci autorun` verifica a home. Ele está adiado,
      # não cancelado.
      #
      # Atenção a quem for restaurar: instalar `@lhci/cli` não basta. O
      # `lighthouserc.json` não tem `startServerCommand` e este workflow não
      # sobe servidor — o passo trocaria "command not found" por "connection
      # refused". Falta também o `throttling` de 3G que o orçamento exige.

      - name: Anexar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            playwright-report/
          retention-days: 7
